<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <!-- Border Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <!-- Water Droplet Gradient -->
    <linearGradient id="waterGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <!-- Pill Top Gradient (Red) -->
    <linearGradient id="pillRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>
    <!-- Pill Bottom Gradient (Amber/Yellow) -->
    <linearGradient id="pillAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.14" />
    </filter>
    <filter id="itemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0369A1" flood-opacity="0.22" />
    </filter>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350F" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Outer Squircle with Soft Rounded Corner -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="120" stroke="url(#ringGrad)" stroke-width="8" fill="none" opacity="0.8" />
  <!-- Center Pure White Card with Soft Depth -->
  <rect x="48" y="48" width="416" height="416" rx="98" fill="#FFFFFF" filter="url(#cardShadow)" />
  <!-- 1. WATER DROPLET (Left Side) -->
  <g filter="url(#itemShadow)">
    <!-- Droplet Body -->
    <path
      d="M176 116 C176 116 88 232 88 304 C88 357 127 400 176 400 C225 400 264 357 264 304 C264 232 176 116 176 116 Z"
      fill="url(#waterGrad)"
    />
    <!-- Droplet Specular Reflection Shine -->
    <path
      d="M144 266 C144 230 162 196 186 182 C172 196 166 218 166 244 C166 270 180 292 180 292 C154 286 144 278 144 266 Z"
      fill="#FFFFFF"
      opacity="0.75"
    />
    <!-- Droplet small bottom glint -->
    <ellipse cx="152" cy="350" rx="16" ry="10" fill="#BAE6FD" opacity="0.6" transform="rotate(-30 152 350)" />
  </g>
  <!-- 2. MEDICINE CAPSULE PILL (Right Side, Tilted -38deg) -->
  <g filter="url(#pillShadow)" transform="translate(340, 260) rotate(-38)">
    <!-- Top Half (Red) with Rounded Cap -->
    <path
      d="M-44 -12 C-44 -56 -44 -110 0 -110 C44 -110 44 -56 44 -12 L-44 -12 Z"
      fill="url(#pillRedGrad)"
    />
    <!-- Bottom Half (Amber/Gold) with Rounded Cap -->
    <path
      d="M-44 12 C-44 56 -44 110 0 110 C44 110 44 56 44 12 L-44 12 Z"
      fill="url(#pillAmberGrad)"
    />
    <!-- Center Pure White Divider Band -->
    <rect x="-44" y="-12" width="88" height="24" fill="#FFFFFF" />
    <!-- Pill Longitudinal Glossy Highlight -->
    <rect x="-24" y="-88" width="14" height="152" rx="7" fill="#FFFFFF" opacity="0.55" />
    <circle cx="-17" cy="-76" r="6" fill="#FFFFFF" opacity="0.8" />
  </g>
  <!-- Central Unity Symbol: Small Cross of Care / Heart -->
  <circle cx="256" cy="256" r="32" fill="#0284C7" stroke="#FFFFFF" stroke-width="6" />
  <path
    d="M256 245 C256 245 244 233 236 241 C228 249 234 261 256 274 C278 261 284 249 276 241 C268 233 256 245 256 245 Z"
    fill="#FFFFFF"
  />
</svg>
